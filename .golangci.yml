# golangci-lint v2 config. The depguard rule enforces core purity in CI,
# mirroring internal/core/core_test.go (which enforces it under `go test`). The
# files glob covers internal/core and every feature slice under it (core/todos, …).
version: "2"

linters:
  enable:
    - depguard
  settings:
    depguard:
      rules:
        core-must-be-pure:
          files:
            - "**/internal/core/**"
            - "!**/internal/core/**_test.go"
          deny:
            - pkg: "os"
              desc: "core must be pure — return an Effect instead of touching the filesystem"
            - pkg: "os/exec"
              desc: "core must be pure — no subprocesses"
            - pkg: "net"
              desc: "core must be pure — return an Effect instead of doing network I/O"
            - pkg: "net/http"
              desc: "core must be pure — return an Effect instead of doing network I/O"
            - pkg: "database/sql"
              desc: "core must be pure — return an Effect instead of touching the database"
            - pkg: "syscall"
              desc: "core must be pure"
            - pkg: "log"
              desc: "core must be pure — return a WriteAuditLog effect instead"
            - pkg: "agentic-sandbox/internal/shell"
              desc: "core must not depend on infrastructure"
            - pkg: "agentic-sandbox/internal/kernel"
              desc: "core must not depend on the framework/executor"
            - pkg: "agentic-sandbox/internal/api"
              desc: "core must not depend on the HTTP layer"
